stroke-width="2"/><rect x="603.1200000000001" y="780.54" width="14.399999999999977" height="14.400000000000091" fill="#eacb70" stroke="#eacb70" stroke-width="2"/><rect x="625.98" y="780.54" width="14.400000000000091" height="14.400000000000091" fill="#eacb70" stroke="#eacb70" stroke-width="2"/><rect x="648.84" y="780.54" width="14.399999999999977" height="14.400000000000091" fill="#eacb70" stroke="#eacb70" stroke-width="2"/><rect x="660" y="654" width="63" height="63" fill="#aeb7c1" stroke="#f1f4f7" stroke-width="2"/><polyline points="723,681 810,681" fill="none" stroke="#395a79" stroke-width="3"/><text x="765" y="652" font-family="Arial" font-size="25" fill="#17283d">USB</text><text x="765" y="682" font-family="Arial" font-size="19" fill="#17283d">side opening</text><polyline points="120,215 705,215" fill="none" stroke="#41566d" stroke-width="2"/><text x="345" y="203" font-family="Arial" font-size="23" fill="#17283d">65 mm</text><polyline points="85,240 85,825" fill="none" stroke="#41566d" stroke-width="2"/><text x="25" y="523" font-family="Arial" font-size="22" fill="#17283d">65</text><text x="120" y="865" font-family="Arial" font-size="20" fill="#17283d">Top view of carrier PCB - component positions are provisional.</text><text x="940" y="264" font-family="Arial" font-size="29" fill="#17283d">Connections</text><text x="940" y="305" font-family="Arial" font-size="20" fill="#17283d">J1 Previous: 3.3 V / GPIO25 / GND</text><text x="940" y="337" font-family="Arial" font-size="20" fill="#17283d">J2 Play/pause: 3.3 V / GPIO26 / GND</text><text x="940" y="369" font-family="Arial" font-size="20" fill="#17283d">J3 Next: 3.3 V / GPIO27 / GND</text><text x="940" y="401" font-family="Arial" font-size="20" fill="#17283d">J4 LCD: GND / 5 V / SDA / SCL</text><text x="940" y="433" font-family="Arial" font-size="20" fill="#17283d"></text><text x="940" y="465" font-family="Arial" font-size="20" fill="#17283d">GPIO21 -&gt; level shift -&gt; LCD SDA</text><text x="940" y="497" font-family="Arial" font-size="20" fill="#17283d">GPIO22 -&gt; level shift -&gt; LCD SCL</text><text x="940" y="529" font-family="Arial" font-size="20" fill="#17283d"></text><text x="940" y="561" font-family="Arial" font-size="20" fill="#17283d">Power enters through ESP32 Micro-USB.</text><text x="940" y="593" font-family="Arial" font-size="20" fill="#17283d">USB-derived 5 V supplies the LCD.</text><text x="940" y="625" font-family="Arial" font-size="20" fill="#17283d">ESP32 3.3 V supplies the button modules.</text><text x="940" y="710" font-family="Arial" font-size="25" fill="#17283d">Mechanical checks still needed</text><text x="940" y="752" font-family="Arial" font-size="20" fill="#17283d">Header end offsets and USB projection</text><text x="940" y="785" font-family="Arial" font-size="20" fill="#17283d">Actual antenna location / clearances</text><text x="940" y="818" font-family="Arial" font-size="20" fill="#17283d">LCD backpack position above this PCB</text><text x="940" y="851" font-family="Arial" font-size="20" fill="#17283d">Mounting holes after enclosure alignment</text><text x="65" y="954" font-family="Arial" font-size="29" fill="#17283d">Enclosure arrangement</text><text x="65" y="992" font-family="Arial" font-size="23" fill="#17283d">LCD on angled front panel. Buttons remain separate on short three-wire cables.</text><text x="65" y="1029" font-family="Arial" font-size="23" fill="#17283d">Carrier sits in the base. Keep the antenna away from LCD metal and cable bundles.</text><text x="65" y="1083" font-family="Arial" font-size="23" fill="#b34720">This drawing shows placement, not copper tracks. Do not order boards from this draft.</text></svg>